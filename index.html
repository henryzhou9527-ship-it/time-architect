<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Time Architect</title>
    <meta name="description" content="Goal-first time planning cockpit with task estimates, workload ledger, health constraints, and model council support.">
    <meta name="theme-color" content="#FFFDF8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TimeArch">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/time-architect.css">
</head>
<body>
    <div id="ta-root"></div>

    <script>
        window.TIME_ARCHITECT_STANDALONE = true;
        window.getCurrentSession = () => null;
        window.nbEsc = value => String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof window.openCalendarPlanner === 'function') window.openCalendarPlanner();
        });
        if ('serviceWorker' in navigator
            && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
    <script src="js/app-config.js"></script>
    <script src="js/calendar-planner.js"></script>
</body>
</html>
